<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>体育館ラン & 筋トレ Tracker</title>
  <style>
    :root {
      --bg: #101317;
      --card: #181d24;
      --card-border: #28303d;
      --text: #f1f5f9;
      --text-sub: #8e9baa;
      --accent-jog: #00d26a;
      --accent-jog-dark: #008744;
      --accent-pause: #f59e0b;
      --accent-dash: #ff7b00;
      --accent-danger: #ef4444;
      --accent-gym: #a855f7;
      --accent-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      /* スマホ下端のスワイプバー操作用の余白（約1cm以上確保） */
      padding-bottom: calc(36px + env(safe-area-inset-bottom, 15px));
    }

    header {
      background: #14181f;
      padding: 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .app-title {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .btn-header {
      background: var(--card);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    nav {
      display: flex;
      background: #12161c;
      border-bottom: 1px solid var(--card-border);
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      border-bottom: 3px solid transparent;
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent-jog);
      background: rgba(255, 255, 255, 0.03);
    }
    .tab-btn.dash-tab.active { border-bottom-color: var(--accent-dash); }
    .tab-btn.gym-tab.active { border-bottom-color: var(--accent-gym); }

    main {
      flex: 1;
      overflow: hidden;
      padding: 6px 8px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tab-pane {
      display: none;
      flex-direction: column;
      height: 100%;
      gap: 6px;
    }
    .tab-pane.active {
      display: flex;
    }

    .config-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 4px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      flex-shrink: 0;
    }
    .config-input {
      width: 60px;
      background: #101317;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 2px 4px;
      border-radius: 4px;
      text-align: right;
      font-size: 0.85rem;
      font-weight: 700;
      user-select: text;
      -webkit-user-select: text;
    }

    /* メインタイマーパネル（コンパクト化） */
    .display-panel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 6px 10px;
      text-align: center;
      flex-shrink: 0;
    }

    .time-large {
      font-size: 2.3rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -1px;
      line-height: 1.0;
      color: #ffffff;
    }

    .dist-sub-row {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin: 1px 0 3px 0;
    }

    .metrics-row {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 4px;
      margin-top: 2px;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .metric-label {
      font-size: 0.62rem;
      color: var(--text-sub);
    }
    .metric-val {
      font-size: 1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    /* 巨大タップボタン（180pxに設定） */
    .huge-tap-btn {
      width: 100%;
      min-height: 180px;
      height: 180px;
      border-radius: 16px;
      border: none;
      color: #031c0e;
      font-weight: 900;
      font-size: 1.9rem;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
      touch-action: manipulation;
      background: linear-gradient(135deg, var(--accent-jog), var(--accent-jog-dark));
    }
    .huge-tap-btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
    .huge-tap-btn.dash-btn {
      background: linear-gradient(135deg, var(--accent-dash), #c25e00);
      color: #fff;
    }
    .tap-subtitle {
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0.9;
    }

    .split-bottom-area {
      flex: 1;
      display: flex;
      gap: 6px;
      min-height: 90px;
      overflow: hidden;
    }

    /* 左側操作列 */
    .left-ctrl-col {
      width: 85px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex-shrink: 0;
    }

    .btn-side-main {
      flex: 3;
      background: var(--accent-jog);
      color: #031c0e;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      touch-action: manipulation;
    }
    .btn-side-main.running {
      background: var(--accent-pause);
      color: #1a1200;
    }
    .btn-side-main.dash-theme {
      background: var(--accent-dash);
      color: #fff;
    }

    .btn-side-sub {
      flex: 2;
      border: none;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
      padding: 0;
    }
    .btn-side-finish {
      background: #2b1f24;
      border: 1px solid #6b2a37;
      color: #fca5a5;
    }
    .btn-side-finish:active { background: var(--accent-danger); color: #fff; }

    .btn-side-save {
      background: #1b283d;
      border: 1px solid #2563eb;
      color: #93c5fd;
      opacity: 0.35;
      pointer-events: none;
    }
    .btn-side-save.ready {
      opacity: 1;
      pointer-events: auto;
      background: #2563eb;
      color: #fff;
    }

    /* 右側ラップリスト（コンパクト化） */
    .lap-list-container {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .lap-header {
      padding: 3px 6px;
      font-size: 0.62rem;
      color: var(--text-sub);
      background: #13171e;
      display: grid;
      grid-template-columns: 24px 1fr 44px 24px;
      align-items: center;
      text-align: right;
      border-bottom: 1px solid var(--card-border);
    }
    .lap-header > span:nth-child(1),
    .lap-header > span:nth-child(2) {
      text-align: left;
    }

    .lap-rows {
      flex: 1;
      overflow-y: auto;
      padding: 1px 0;
    }

    .lap-row {
      display: grid;
      grid-template-columns: 24px 1fr 44px 24px;
      align-items: center;
      padding: 3px 6px;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      text-align: right;
    }
    .lap-row > span:nth-child(1),
    .lap-row > span:nth-child(2) {
      text-align: left;
    }

    .lap-select-laps {
      background: #101317;
      border: 1px solid #333f50;
      color: var(--accent-blue);
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 0;
      text-align: center;
    }

    .btn-lap-del {
      background: none;
      border: none;
      color: #ef4444;
      font-weight: 900;
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0;
    }

    /* =========================
       筋トレタブ
       ========================= */
    .gym-scroll-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
    }

    .gym-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .gym-row-1 {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .gym-col-half {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .gym-label {
      font-size: 0.65rem;
      color: var(--text-sub);
    }
    .gym-select, .gym-target-part {
      background: #111419;
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.8rem;
      width: 100%;
    }
    .gym-target-part {
      color: var(--accent-blue);
      font-weight: 700;
      display: flex;
      align-items: center;
      min-height: 29px;
    }

    .gym-row-2 {
      display: flex;
      gap: 6px;
    }
    .gym-col-third {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .gym-input-num {
      background: #111419;
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 6px;
      padding: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      text-align: center;
      width: 100%;
      user-select: text;
      -webkit-user-select: text;
    }

    .btn-remove-card {
      position: absolute;
      top: 4px;
      right: 6px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-remove-card:hover { color: var(--accent-danger); }

    .btn-add-exercise {
      background: #1a2230;
      border: 1px dashed var(--accent-blue);
      color: var(--accent-blue);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .gym-memo-area {
      background: #111419;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      padding: 6px;
      font-size: 0.8rem;
      width: 100%;
      resize: none;
      user-select: text;
      -webkit-user-select: text;
    }

    .btn-save-gym-all {
      background: var(--accent-gym);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 履歴 */
    .history-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 0.75rem;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .history-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }
    .history-del-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 0 4px;
    }
    .history-del-btn:hover { color: var(--accent-danger); }
    .history-details {
      background: #111419;
      border-radius: 4px;
      padding: 5px;
      font-size: 0.7rem;
      max-height: 120px;
      overflow-y: auto;
      margin-top: 3px;
    }

    /* デフォルト値編集モーダル */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 12px;
    }
    .modal-content {
      background: #181d24;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 10px;
      background: #14181f;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 0.9rem;
    }
    .modal-body {
      padding: 8px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .default-edit-row {
      background: #111419;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">GYM RUNNER</div>
    <button class="btn-header" id="fullscreenBtn">⛶ 全画面</button>
  </header>

  <nav>
    <button class="tab-btn active" data-tab="jogTab">ジョグ周回</button>
    <button class="tab-btn dash-tab" data-tab="dashTab">ダッシュ計測</button>
    <button class="tab-btn gym-tab" data-tab="gymTab">筋トレ</button>
    <button class="tab-btn" data-tab="historyTab">履歴</button>
  </nav>

  <main>
    <!-- 1. ジョグ周回タブ -->
    <div class="tab-pane active" id="jogTab">
      <div class="config-box">
        <span>体育館 1周の距離:</span>
        <div>
          <input type="number" id="jogLapDistance" class="config-input" value="275" step="5">
          <span> m</span>
        </div>
      </div>

      <div class="display-panel">
        <div class="time-large" id="jogTimeDisplay">00:00.0</div>
        <div class="dist-sub-row" id="jogDistDisplay">0.00 km (0 周)</div>
        <div class="metrics-row">
          <div class="metric-item">
            <span class="metric-label">周回数</span>
            <span class="metric-val" id="jogLapCount">0</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">現在ラップ (継続)</span>
            <span class="metric-val" id="jogCurrentLap" style="color:var(--accent-blue);">00:00.0</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">平均ラップ</span>
            <span class="metric-val" id="jogAvgLap">--:--.-</span>
          </div>
        </div>
      </div>

      <!-- 巨大タップボタン（2倍大） -->
      <button class="huge-tap-btn" id="jogTapBtn">
        <span>+1 周 カウント</span>
        <span class="tap-subtitle">タップで周回加算 & ラップ刻み</span>
      </button>

      <!-- 下部半分の操作エリア -->
      <div class="split-bottom-area">
        <div class="left-ctrl-col">
          <button class="btn-side-main" id="jogStartPauseBtn">
            <span id="jogMainBtnIcon">▶</span>
            <span id="jogMainBtnText">スタート</span>
          </button>
          <button class="btn-side-sub btn-side-finish" id="jogFinishBtn">終了</button>
          <button class="btn-side-sub btn-side-save" id="jogSaveBtn">保存</button>
        </div>

        <div class="lap-list-container">
          <div class="lap-header">
            <span>#</span>
            <span>ラップタイム</span>
            <span>周回</span>
            <span>消</span>
          </div>
          <div class="lap-rows" id="jogLapList"></div>
        </div>
      </div>
    </div>

    <!-- 2. ダッシュ計測タブ -->
    <div class="tab-pane" id="dashTab">
      <div class="config-box">
        <span>距離設定:</span>
        <div>
          <input type="number" id="dashDistanceSetting" class="config-input" value="200" step="10">
          <span> m</span>
        </div>
      </div>

      <div class="display-panel">
        <div class="time-large" id="dashTimeDisplay" style="color:var(--accent-dash);">00:00.00</div>
        <div class="dist-sub-row" id="dashInfoRow" style="color:#fdba74;">200m 計測</div>
        <div class="metrics-row">
          <div class="metric-item">
            <span class="metric-label">記録数</span>
            <span class="metric-val" id="dashLapCount">0</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">現在ラップ (継続)</span>
            <span class="metric-val" id="dashCurrentLap" style="color:#fdba74;">00:00.00</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">最新ラップ</span>
            <span class="metric-val" id="dashLastLap">--.--</span>
          </div>
        </div>
      </div>

      <!-- 巨大タップボタン（2倍大） -->
      <button class="huge-tap-btn dash-btn" id="dashTapBtn">
        <span>タップして記録</span>
        <span class="tap-subtitle">通過ごとにタップ（距離は右側で指定可）</span>
      </button>

      <!-- 下部半分の操作エリア -->
      <div class="split-bottom-area">
        <div class="left-ctrl-col">
          <button class="btn-side-main dash-theme" id="dashStartPauseBtn">
            <span id="dashMainBtnIcon">▶</span>
            <span id="dashMainBtnText">スタート</span>
          </button>
          <button class="btn-side-sub btn-side-finish" id="dashFinishBtn">終了</button>
          <button class="btn-side-sub btn-side-save" id="dashSaveBtn">保存</button>
        </div>

        <div class="lap-list-container">
          <div class="lap-header" style="grid-template-columns: 24px 1fr 50px 24px;">
            <span>#</span>
            <span>区間タイム</span>
            <span>距離(m)</span>
            <span>消</span>
          </div>
          <div class="lap-rows" id="dashLapList"></div>
        </div>
      </div>
    </div>

    <!-- 3. 筋トレタブ -->
    <div class="tab-pane" id="gymTab">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
        <span style="font-size:0.8rem; font-weight:700;">マシン・種目記録</span>
        <button class="btn-header" id="openDefaultEditModalBtn" style="color:var(--accent-gym);">⚙ デフォルト編集</button>
      </div>

      <div class="gym-scroll-container" id="gymScrollArea">
        <div id="gymEntriesContainer" style="display:flex; flex-direction:column; gap:6px;"></div>

        <button type="button" class="btn-add-exercise" id="btnAddExercise">＋ 種目を追加</button>

        <div style="display:flex; flex-direction:column; gap:3px; margin-top:2px;">
          <label style="font-size:0.7rem; color:var(--text-sub);">メモ（5行）</label>
          <textarea id="gymTotalMemo" class="gym-memo-area" rows="5" placeholder="今日の体調、追い込み度、有酸素の詳細など..."></textarea>
        </div>

        <button type="button" class="btn-save-gym-all" id="btnSaveGymAll">筋トレログを保存</button>
      </div>
    </div>

    <!-- 4. 履歴タブ -->
    <div class="tab-pane" id="historyTab">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span style="font-size:0.78rem; color:var(--text-sub);">保存されたアクティビティ</span>
        <button class="btn-header" id="clearHistoryBtn" style="color:var(--accent-danger);">全削除</button>
      </div>
      <div id="historyList" style="flex:1; overflow-y:auto;"></div>
    </div>
  </main>

  <!-- デフォルト編集モーダル -->
  <div class="modal-overlay" id="defaultEditModal">
    <div class="modal-content">
      <div class="modal-header">
        <span>マシンのデフォルト基準値 編集</span>
        <button class="history-del-btn" id="closeDefaultEditModalBtn" style="font-size:1.3rem;">×</button>
      </div>
      <div class="modal-body" id="defaultEditList"></div>
      <div style="padding:8px; background:#14181f; display:flex; gap:6px;">
        <button class="btn-header" id="resetDefaultsBtn" style="flex:1;">初期値に戻す</button>
        <button class="btn-header" id="saveDefaultsBtn" style="flex:1; background:var(--accent-gym); color:#fff;">変更を保存</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // マシン初期データ
    // ==========================================
    const INITIAL_MACHINE_MASTER = [
      { name: "チェスト・プレス", part: "大胸筋", weight: "27.5", reps: "10", sets: "3" },
      { name: "ペクトラル・フライ", part: "大胸筋", weight: "35", reps: "10", sets: "3" },

      { name: "リカンベント・バイク", part: "有酸素運動", weight: "30", reps: "-", sets: "-" }
    ];

    function getMachineMaster() {
      const saved = localStorage.getItem('gym_machine_master_v1');
      if (saved) {
        try { return JSON.parse(saved); } catch(e){}
      }
      return JSON.parse(JSON.stringify(INITIAL_MACHINE_MASTER));
    }

    function saveMachineMaster(data) {
      localStorage.setItem('gym_machine_master_v1', JSON.stringify(data));
    }

    // --- ユーティリティ ---
    const formatTime = (ms, showHundredths = false) => {
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const tenth = Math.floor((ms % 1000) / 100);
      const hundredth = Math.floor((ms % 1000) / 10);
      const mm = String(m).padStart(2, '0');
      const ss = String(s).padStart(2, '0');
      if (showHundredths) {
        return `${mm}:${ss}.${String(hundredth).padStart(2, '0')}`;
      }
      return `${mm}:${ss}.${tenth}`;
    };

    const getNowStamp = () => {
      const d = new Date();
      return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    };

    const vibrate = (ms = 40) => {
      if (navigator.vibrate) navigator.vibrate(ms);
    };

    // タブ切り替え
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'historyTab') renderHistory();
      });
    });

    // 全画面切り替え
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // ==========================================
    // 1. ジョグ周回ロジック（リセット対応）
    // ==========================================
    let jogTimer = null;
    let jogStartTime = 0;
    let jogElapsed = 0;
    let jogIsRunning = false;
    let jogLastTapMs = 0;
    let jogLaps = [];
    let jogIsFinished = false;

    const jogTimeDisplay = document.getElementById('jogTimeDisplay');
    const jogDistDisplay = document.getElementById('jogDistDisplay');
    const jogLapCount = document.getElementById('jogLapCount');
    const jogCurrentLap = document.getElementById('jogCurrentLap');
    const jogAvgLap = document.getElementById('jogAvgLap');
    const jogLapList = document.getElementById('jogLapList');
    const jogLapDistanceInput = document.getElementById('jogLapDistance');
    const jogStartPauseBtn = document.getElementById('jogStartPauseBtn');
    const jogFinishBtn = document.getElementById('jogFinishBtn');
    const jogSaveBtn = document.getElementById('jogSaveBtn');

    function getTotalJogLapsCount() {
      return jogLaps.reduce((sum, item) => sum + item.lapCountMultiplier, 0);
    }

    function updateJogDisplay() {
      const totalMs = jogIsRunning ? jogElapsed + (Date.now() - jogStartTime) : jogElapsed;
      jogTimeDisplay.innerText = formatTime(totalMs);

      const currentLapDuration = Math.max(0, totalMs - jogLastTapMs);
      jogCurrentLap.innerText = formatTime(currentLapDuration);

      const totalLaps = getTotalJogLapsCount();
      const oneLapM = parseFloat(jogLapDistanceInput.value) || 275;
      const totalDistKm = (totalLaps * oneLapM) / 1000;

      jogDistDisplay.innerText = `${totalDistKm.toFixed(2)} km (${totalLaps} 周)`;
      jogLapCount.innerText = totalLaps;

      if (totalLaps > 0 && totalMs > 1000) {
        jogAvgLap.innerText = formatTime(totalMs / totalLaps);
      } else {
        jogAvgLap.innerText = `--:--.-`;
      }
    }

    jogStartPauseBtn.addEventListener('click', () => {
      // リセット待ち状態から再開された場合はリセット状態を解除
      jogIsFinished = false;
      jogFinishBtn.innerText = '終了';
      jogFinishBtn.style.color = '#fca5a5';

      if (!jogIsRunning) {
        jogIsRunning = true;
        jogStartTime = Date.now();
        jogTimer = setInterval(updateJogDisplay, 60);
        jogStartPauseBtn.classList.add('running');
        document.getElementById('jogMainBtnIcon').innerText = '⏸';
        document.getElementById('jogMainBtnText').innerText = '一時停止';
        jogSaveBtn.classList.remove('ready');
        vibrate();
      } else {
        jogIsRunning = false;
        jogElapsed += Date.now() - jogStartTime;
        clearInterval(jogTimer);
        jogStartPauseBtn.classList.remove('running');
        document.getElementById('jogMainBtnIcon').innerText = '▶';
        document.getElementById('jogMainBtnText').innerText = '再開';
        updateJogDisplay();
      }
    });

    document.getElementById('jogTapBtn').addEventListener('click', () => {
      if (!jogIsRunning && jogElapsed === 0) {
        jogStartPauseBtn.click();
        return;
      }
      const totalMs = jogIsRunning ? jogElapsed + (Date.now() - jogStartTime) : jogElapsed;
      const lapMs = totalMs - jogLastTapMs;
      jogLastTapMs = totalMs;

      jogLaps.push({
        id: Date.now() + Math.random(),
        lapTime: lapMs,
        totalTime: totalMs,
        lapCountMultiplier: 1
      });
      renderJogLaps();
      updateJogDisplay();
      vibrate(50);
    });

    function renderJogLaps() {
      jogLapList.innerHTML = '';
      [...jogLaps].reverse().forEach((l, revIdx) => {
        const actualIdx = jogLaps.length - 1 - revIdx;
        const row = document.createElement('div');
        row.className = 'lap-row';
        row.innerHTML = `
          <span style="color:var(--text-sub); font-size:0.65rem;">#${actualIdx + 1}</span>
          <span style="font-weight:700;">${formatTime(l.lapTime)}</span>
          <span>
            <select class="lap-select-laps" data-idx="${actualIdx}">
              <option value="1" ${l.lapCountMultiplier === 1 ? 'selected' : ''}>1周</option>
              <option value="2" ${l.lapCountMultiplier === 2 ? 'selected' : ''}>2周</option>
              <option value="3" ${l.lapCountMultiplier === 3 ? 'selected' : ''}>3周</option>
              <option value="4" ${l.lapCountMultiplier === 4 ? 'selected' : ''}>4周</option>
              <option value="5" ${l.lapCountMultiplier === 5 ? 'selected' : ''}>5周</option>
            </select>
          </span>
          <span><button class="btn-lap-del" data-idx="${actualIdx}">×</button></span>
        `;

        row.querySelector('.lap-select-laps').addEventListener('change', (e) => {
          jogLaps[actualIdx].lapCountMultiplier = parseInt(e.target.value, 10);
          updateJogDisplay();
        });

        row.querySelector('.btn-lap-del').addEventListener('click', () => {
          jogLaps.splice(actualIdx, 1);
          renderJogLaps();
          updateJogDisplay();
        });

        jogLapList.appendChild(row);
      });
    }

    jogFinishBtn.addEventListener('click', () => {
      if (jogIsFinished) {
        if (confirm('保存せずに計測データをリセットしますか？')) {
          jogElapsed = 0;
          jogLastTapMs = 0;
          jogLaps = [];
          jogIsFinished = false;
          jogFinishBtn.innerText = '終了';
          jogFinishBtn.style.color = '#fca5a5';
          jogSaveBtn.classList.remove('ready');
          renderJogLaps();
          updateJogDisplay();
        }
        return;
      }

      if (jogIsRunning) {
        jogIsRunning = false;
        jogElapsed += Date.now() - jogStartTime;
        clearInterval(jogTimer);
        jogStartPauseBtn.classList.remove('running');
        document.getElementById('jogMainBtnIcon').innerText = '▶';
        document.getElementById('jogMainBtnText').innerText = 'スタート';
      }

      jogIsFinished = true;
      jogFinishBtn.innerText = 'リセット';
      jogFinishBtn.style.color = '#ef4444';
      jogSaveBtn.classList.add('ready');
      updateJogDisplay();
      vibrate([40, 40]);
    });

    jogSaveBtn.addEventListener('click', () => {
      const totalMs = jogElapsed;
      const totalLaps = getTotalJogLapsCount();
      if (totalMs < 1000 && totalLaps === 0) return;

      const oneLapM = parseFloat(jogLapDistanceInput.value) || 275;
      const totalDistKm = ((totalLaps * oneLapM) / 1000).toFixed(2);

      const log = {
        id: Date.now(),
        date: getNowStamp(),
        type: 'ジョグ周回',
        timeStr: formatTime(totalMs),
        distStr: `${totalDistKm} km (${totalLaps}周)`,
        avgLapStr: totalLaps > 0 ? formatTime(totalMs / totalLaps) : '--',
        details: jogLaps.map((l, i) => ({
          num: i + 1,
          time: formatTime(l.lapTime),
          laps: l.lapCountMultiplier
        }))
      };

      saveLog(log);
      alert(`保存しました！\n日時: ${log.date}\n総距離: ${log.distStr}\n総タイム: ${log.timeStr}\n平均ラップ: ${log.avgLapStr}`);

      jogElapsed = 0;
      jogLastTapMs = 0;
      jogLaps = [];
      jogIsFinished = false;
      jogFinishBtn.innerText = '終了';
      jogFinishBtn.style.color = '#fca5a5';
      jogSaveBtn.classList.remove('ready');
      renderJogLaps();
      updateJogDisplay();
    });

    // ==========================================
    // 2. ダッシュ計測ロジック（リセット対応）
    // ==========================================
    let dashTimer = null;
    let dashStartTime = 0;
    let dashElapsed = 0;
    let dashIsRunning = false;
    let dashLastTapMs = 0;
    let dashLaps = [];
    let dashIsFinished = false;

    const dashTimeDisplay = document.getElementById('dashTimeDisplay');
    const dashLapCount = document.getElementById('dashLapCount');
    const dashCurrentLap = document.getElementById('dashCurrentLap');
    const dashLastLap = document.getElementById('dashLastLap');
    const dashLapList = document.getElementById('dashLapList');
    const dashDistanceSetting = document.getElementById('dashDistanceSetting');
    const dashInfoRow = document.getElementById('dashInfoRow');
    const dashStartPauseBtn = document.getElementById('dashStartPauseBtn');
    const dashFinishBtn = document.getElementById('dashFinishBtn');
    const dashSaveBtn = document.getElementById('dashSaveBtn');

    dashDistanceSetting.addEventListener('input', () => {
      dashInfoRow.innerText = `${dashDistanceSetting.value || 0}m 計測`;
    });

    function updateDashDisplay() {
      const totalMs = dashIsRunning ? dashElapsed + (Date.now() - dashStartTime) : dashElapsed;
      dashTimeDisplay.innerText = formatTime(totalMs, true);

      const curMs = Math.max(0, totalMs - dashLastTapMs);
      dashCurrentLap.innerText = formatTime(curMs, true);
    }

    dashStartPauseBtn.addEventListener('click', () => {
      dashIsFinished = false;
      dashFinishBtn.innerText = '終了';
      dashFinishBtn.style.color = '#fca5a5';

      if (!dashIsRunning) {
        dashIsRunning = true;
        dashStartTime = Date.now();
        dashTimer = setInterval(updateDashDisplay, 30);
        dashStartPauseBtn.classList.add('running');
        document.getElementById('dashMainBtnIcon').innerText = '⏸';
        document.getElementById('dashMainBtnText').innerText = '一時停止';
        dashSaveBtn.classList.remove('ready');
        vibrate();
      } else {
        dashIsRunning = false;
        dashElapsed += Date.now() - dashStartTime;
        clearInterval(dashTimer);
        dashStartPauseBtn.classList.remove('running');
        document.getElementById('dashMainBtnIcon').innerText = '▶';
        document.getElementById('dashMainBtnText').innerText = '再開';
        updateDashDisplay();
      }
    });

    document.getElementById('dashTapBtn').addEventListener('click', () => {
      if (!dashIsRunning && dashElapsed === 0) {
        dashStartPauseBtn.click();
        return;
      }
      const totalMs = dashIsRunning ? dashElapsed + (Date.now() - dashStartTime) : dashElapsed;
      const lapMs = totalMs - dashLastTapMs;
      dashLastTapMs = totalMs;

      const approxDist = (dashLaps.length + 1) * 50;
      dashLaps.push({
        id: Date.now() + Math.random(),
        lapTime: lapMs,
        totalTime: totalMs,
        distM: approxDist
      });

      dashLapCount.innerText = dashLaps.length;
      dashLastLap.innerText = formatTime(lapMs, true);
      renderDashLaps();
      vibrate(50);
    });

    function renderDashLaps() {
      dashLapList.innerHTML = '';
      [...dashLaps].reverse().forEach((l, revIdx) => {
        const actualIdx = dashLaps.length - 1 - revIdx;
        const row = document.createElement('div');
        row.className = 'lap-row';
        row.style.gridTemplateColumns = '24px 1fr 50px 24px';
        row.innerHTML = `
          <span style="color:var(--text-sub); font-size:0.65rem;">#${actualIdx + 1}</span>
          <span style="font-weight:700;">${formatTime(l.lapTime, true)}</span>
          <span>
            <input type="number" class="config-input" style="width:46px; font-size:0.7rem; padding:1px;" value="${l.distM}" data-idx="${actualIdx}">
          </span>
          <span><button class="btn-lap-del" data-idx="${actualIdx}">×</button></span>
        `;

        row.querySelector('input').addEventListener('change', (e) => {
          dashLaps[actualIdx].distM = parseFloat(e.target.value) || 0;
        });

        row.querySelector('.btn-lap-del').addEventListener('click', () => {
          dashLaps.splice(actualIdx, 1);
          dashLapCount.innerText = dashLaps.length;
          renderDashLaps();
        });

        dashLapList.appendChild(row);
      });
    }

    dashFinishBtn.addEventListener('click', () => {
      if (dashIsFinished) {
        if (confirm('保存せずにダッシュデータをリセットしますか？')) {
          dashElapsed = 0;
          dashLastTapMs = 0;
          dashLaps = [];
          dashLapCount.innerText = '0';
          dashLastLap.innerText = '--.--';
          dashIsFinished = false;
          dashFinishBtn.innerText = '終了';
          dashFinishBtn.style.color = '#fca5a5';
          dashSaveBtn.classList.remove('ready');
          renderDashLaps();
          updateDashDisplay();
        }
        return;
      }

      if (dashIsRunning) {
        dashIsRunning = false;
        dashElapsed += Date.now() - dashStartTime;
        clearInterval(dashTimer);
        dashStartPauseBtn.classList.remove('running');
        document.getElementById('dashMainBtnIcon').innerText = '▶';
        document.getElementById('dashMainBtnText').innerText = 'スタート';
      }

      dashIsFinished = true;
      dashFinishBtn.innerText = 'リセット';
      dashFinishBtn.style.color = '#ef4444';
      dashSaveBtn.classList.add('ready');
      updateDashDisplay();
      vibrate([40, 40]);
    });

    dashSaveBtn.addEventListener('click', () => {
      const totalMs = dashElapsed;
      if (totalMs < 500 && dashLaps.length === 0) return;

      const distVal = dashDistanceSetting.value || 200;
      const log = {
        id: Date.now(),
        date: getNowStamp(),
        type: `ダッシュ (${distVal}m)`,
        timeStr: formatTime(totalMs, true),
        distStr: `${distVal}m (${dashLaps.length}回計測)`,
        details: dashLaps.map((l, i) => ({
          num: i + 1,
          time: formatTime(l.lapTime, true),
          dist: `${l.distM}m`
        }))
      };

      saveLog(log);
      alert(`ダッシュ結果を保存しました！\nタイム: ${log.timeStr}\nラップ数: ${dashLaps.length}`);

      dashElapsed = 0;
      dashLastTapMs = 0;
      dashLaps = [];
      dashLapCount.innerText = '0';
      dashLastLap.innerText = '--.--';
      dashIsFinished = false;
      dashFinishBtn.innerText = '終了';
      dashFinishBtn.style.color = '#fca5a5';
      dashSaveBtn.classList.remove('ready');
      renderDashLaps();
      updateDashDisplay();
    });

    // ==========================================
    // 3. 筋トレロジック
    // ==========================================
    const gymEntriesContainer = document.getElementById('gymEntriesContainer');
    const btnAddExercise = document.getElementById('btnAddExercise');
    const btnSaveGymAll = document.getElementById('btnSaveGymAll');

    function createGymCard(initialMachineName = null) {
      const master = getMachineMaster();
      const card = document.createElement('div');
      card.className = 'gym-card';

      const defaultItem = initialMachineName 
        ? master.find(m => m.name === initialMachineName) || master[0]
        : master[0];

      const optionsHtml = master.map(m => `
        <option value="${m.name}" ${m.name === defaultItem.name ? 'selected' : ''}>${m.name}</option>
      `).join('');

      card.innerHTML = `
        <button type="button" class="btn-remove-card" title="削除">×</button>
        <div class="gym-row-1">
          <div class="gym-col-half">
            <span class="gym-label">マシン名</span>
            <select class="gym-select gym-machine-select">
              ${optionsHtml}
            </select>
          </div>
          <div class="gym-col-half">
            <span class="gym-label">主動部位</span>
            <div class="gym-target-part">${defaultItem.part}</div>
          </div>
        </div>

        <div class="gym-row-2">
          <div class="gym-col-third">
            <span class="gym-label">重さ (kg)</span>
            <input type="text" class="gym-input-num gym-weight-input" value="${defaultItem.weight}">
          </div>
          <div class="gym-col-third">
            <span class="gym-label">回数 / 時間</span>
            <input type="text" class="gym-input-num gym-reps-input" value="${defaultItem.reps}">
          </div>
          <div class="gym-col-third">
            <span class="gym-label">セット数</span>
            <input type="text" class="gym-input-num gym-sets-input" value="${defaultItem.sets}">
          </div>
        </div>
      `;

      const selectEl = card.querySelector('.gym-machine-select');
      const partEl = card.querySelector('.gym-target-part');
      const weightInput = card.querySelector('.gym-weight-input');
      const repsInput = card.querySelector('.gym-reps-input');
      const setsInput = card.querySelector('.gym-sets-input');

      selectEl.addEventListener('change', () => {
        const currentMaster = getMachineMaster();
        const selected = currentMaster.find(m => m.name === selectEl.value);
        if (selected) {
          partEl.innerText = selected.part;
          weightInput.value = selected.weight;
          repsInput.value = selected.reps;
          setsInput.value = selected.sets;
        }
      });

      card.querySelector('.btn-remove-card').addEventListener('click', () => {
        if (gymEntriesContainer.children.length > 1) {
          card.remove();
        } else {
          alert('最低1つの種目カードが必要です。');
        }
      });

      return card;
    }

    gymEntriesContainer.appendChild(createGymCard());

    btnAddExercise.addEventListener('click', () => {
      gymEntriesContainer.appendChild(createGymCard());
      document.getElementById('gymScrollArea').scrollTop = document.getElementById('gymScrollArea').scrollHeight;
    });

    btnSaveGymAll.addEventListener('click', () => {
      const cards = gymEntriesContainer.querySelectorAll('.gym-card');
      const list = [];

      cards.forEach(card => {
        const name = card.querySelector('.gym-machine-select').value;
        const part = card.querySelector('.gym-target-part').innerText;
        const weight = card.querySelector('.gym-weight-input').value.trim();
        const reps = card.querySelector('.gym-reps-input').value.trim();
        const sets = card.querySelector('.gym-sets-input').value.trim();

        list.push({ name, part, weight, reps, sets });
      });

      const memo = document.getElementById('gymTotalMemo').value.trim();

      const log = {
        id: Date.now(),
        date: getNowStamp(),
        type: '筋トレ',
        timeStr: '-',
        distStr: `${list.length}種目 実施`,
        memo: memo,
        details: list.map((item, idx) => ({
          num: idx + 1,
          time: `${item.weight !== '-' ? item.weight + 'kg' : ''} ${item.reps !== '-' ? item.reps + '回/分' : ''} ${item.sets !== '-' ? item.sets + 'set' : ''}`,
          dist: `${item.name} [${item.part}]`
        }))
      };

      saveLog(log);
      alert('本日の筋トレログを保存しました！');

      gymEntriesContainer.innerHTML = '';
      gymEntriesContainer.appendChild(createGymCard());
      document.getElementById('gymTotalMemo').value = '';
    });

    // ==========================================
    // デフォルト値編集モーダル
    // ==========================================
    const defaultEditModal = document.getElementById('defaultEditModal');
    const openDefaultEditModalBtn = document.getElementById('openDefaultEditModalBtn');
    const closeDefaultEditModalBtn = document.getElementById('closeDefaultEditModalBtn');
    const defaultEditList = document.getElementById('defaultEditList');
    const saveDefaultsBtn = document.getElementById('saveDefaultsBtn');
    const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');

    function renderDefaultEditRows() {
      const master = getMachineMaster();
      defaultEditList.innerHTML = master.map((m, idx) => `
        <div class="default-edit-row" data-idx="${idx}">
          <div style="display:flex; justify-content:space-between; font-weight:700; font-size:0.78rem;">
            <span>${m.name}</span>
            <span style="color:var(--accent-blue);">${m.part}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <div style="flex:1;">
              <span style="font-size:0.62rem; color:var(--text-sub);">重さ</span>
              <input type="text" class="config-input def-weight" style="width:100%; text-align:center;" value="${m.weight}">
            </div>
            <div style="flex:1;">
              <span style="font-size:0.62rem; color:var(--text-sub);">回数</span>
              <input type="text" class="config-input def-reps" style="width:100%; text-align:center;" value="${m.reps}">
            </div>
            <div style="flex:1;">
              <span style="font-size:0.62rem; color:var(--text-sub);">セット</span>
              <input type="text" class="config-input def-sets" style="width:100%; text-align:center;" value="${m.sets}">
            </div>
          </div>
        </div>
      `).join('');
    }

    openDefaultEditModalBtn.addEventListener('click', () => {
      renderDefaultEditRows();
      defaultEditModal.style.display = 'flex';
    });

    closeDefaultEditModalBtn.addEventListener('click', () => {
      defaultEditModal.style.display = 'none';
    });

    saveDefaultsBtn.addEventListener('click', () => {
      const master = getMachineMaster();
      const rows = defaultEditList.querySelectorAll('.default-edit-row');
      rows.forEach(r => {
        const idx = parseInt(r.dataset.idx, 10);
        master[idx].weight = r.querySelector('.def-weight').value.trim();
        master[idx].reps = r.querySelector('.def-reps').value.trim();
        master[idx].sets = r.querySelector('.def-sets').value.trim();
      });
      saveMachineMaster(master);
      alert('マシンの基準デフォルト値を更新しました！');
      defaultEditModal.style.display = 'none';
    });

    resetDefaultsBtn.addEventListener('click', () => {
      if (confirm('すべてのマシンの数値を初期設定値に戻しますか？')) {
        saveMachineMaster(INITIAL_MACHINE_MASTER);
        renderDefaultEditRows();
      }
    });

    // ==========================================
    // 4. 履歴保存 & 個別削除 & 詳細ラップ展開
    // ==========================================
    function getLogs() {
      return JSON.parse(localStorage.getItem('gym_tracker_logs') || '[]');
    }

    function saveLog(log) {
      const logs = getLogs();
      logs.unshift(log);
      localStorage.setItem('gym_tracker_logs', JSON.stringify(logs));
    }

    window.deleteHistoryItem = function(id) {
      if (confirm('この記録を削除しますか？')) {
        let logs = getLogs();
        logs = logs.filter(item => item.id !== id);
        localStorage.setItem('gym_tracker_logs', JSON.stringify(logs));
        renderHistory();
      }
    };

    function renderHistory() {
      const logs = getLogs();
      const box = document.getElementById('historyList');
      if (logs.length === 0) {
        box.innerHTML = '<div style="color:var(--text-sub); padding:20px; text-align:center;">履歴はありません</div>';
        return;
      }

      box.innerHTML = logs.map(l => {
        let detailsHtml = '';
        if (l.details && l.details.length > 0) {
          detailsHtml = `
            <div class="history-details">
              ${l.details.map(d => `
                <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                  <span>#${d.num} ${d.dist ? `(${d.dist})` : (d.laps ? `(${d.laps}周)` : '')}</span>
                  <span style="font-weight:700;">${d.time}</span>
                </div>
              `).join('')}
            </div>
          `;
        }

        return `
          <div class="history-card">
            <div class="history-card-header">
              <span style="color:#fff;">${l.type}</span>
              <div>
                <span style="color:var(--accent-jog); margin-right:8px;">${l.timeStr !== '-' ? l.timeStr : ''}</span>
                <button class="history-del-btn" onclick="deleteHistoryItem(${l.id})">🗑</button>
              </div>
            </div>
            <div style="color:var(--text); font-weight:600;">${l.distStr || ''}</div>
            <div style="color:var(--text-sub); font-size:0.68rem;">
              ${l.date} ${l.avgLapStr ? '| 平均: ' + l.avgLapStr : ''} ${l.memo ? '| ' + l.memo : ''}
            </div>
            ${detailsHtml}
          </div>
        `;
      }).join('');
    }

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      if (confirm('すべての履歴を完全に削除しますか？')) {
        localStorage.removeItem('gym_tracker_logs');
        renderHistory();
      }
    });
  </script>
</body>
</html>
